<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fuck It, Use Math — Icon atlas</title><style>
*{box-sizing:border-box} :root{color-scheme:light dark;--bg:#f5f6f7;--surface:#fff;--ink:#182129;--muted:#53616a;--line:#ccd3d8;--accent:#215e64} :root[data-theme=dark]{--bg:#11181d;--surface:#1c252c;--ink:#e9f0f3;--muted:#aabac2;--line:#4c5c65;--accent:#9bd2d4} body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif} main{max-width:1140px;margin:auto;padding:32px 20px} header{border-bottom:1px solid var(--line);padding-bottom:20px;margin-bottom:24px} h1{font-size:clamp(28px,5vw,48px);letter-spacing:-.045em;line-height:1.1;margin:10px 0} h2{font-size:20px;margin:0 0 12px} p{color:var(--muted);margin:8px 0} .eyebrow{font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);font-weight:700} .tools{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-top:18px} button,input{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:8px;min-height:44px;padding:8px 12px} button{cursor:pointer} button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px} .icon-button{display:inline-grid;place-items:center;width:44px;height:44px;padding:0} .icon-button svg{width:24px;height:24px} .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:12px} article,.lab{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px} .sizes{display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:56px} .sample{width:var(--size);height:var(--size);display:block;flex:none} .sample svg{display:block;width:100%;height:100%} .name{font-weight:650;text-transform:capitalize;margin-top:12px} .copy{color:var(--accent);background:transparent;border:0;padding:0;min-height:44px;text-align:left} .lab{margin-top:24px;display:grid;grid-template-columns:120px 1fr;gap:20px;align-items:center} .lab svg{width:120px;height:120px} input[type=range]{width:100%;padding:0} textarea{width:100%;min-height:100px;font:12px monospace;background:var(--bg);color:var(--ink);border:1px solid var(--line);padding:10px;border-radius:8px} [hidden]{display:none!important} @media(max-width:400px){main{padding:20px 16px}.lab{grid-template-columns:1fr}} @media(prefers-reduced-motion:no-preference){button{transition:background-color 150ms,color 150ms}} @media(forced-colors:active){button:focus-visible{outline:2px solid Highlight}}
</style></head><body><main><header><div class="eyebrow">Native geometry / 01</div><h1>Fuck It, Use Math.</h1><p>26 local symbols. Five optical inspection sizes. Zero external runtime assets.</p><div class="tools"><button id="search-button" type="button" class="icon-button" aria-label="Focus icon search"><!--SEARCH--></button><input id="filter" type="search" aria-label="Filter icons" placeholder="Find an icon"><button id="theme" type="button" aria-pressed="false">Dark mode</button></div><p id="status" role="status"></p></header><section class="grid" aria-label="Icon catalog"><!--CARDS--></section><section class="lab" aria-label="Parametric gear"><div id="gear"><!--SETTINGS--></div><div><h2>Geometry laboratory</h2><label for="teeth">Teeth: <output id="count">8</output></label><input type="range" id="teeth" min="5" max="12" step="1" value="8"><label for="source">SVG source</label><textarea id="source" readonly></textarea></div></section></main><script>
const registry=<!--DATA-->;
const $=id=>document.getElementById(id);const status=$('status');
$('search-button').addEventListener('click',()=>$('filter').focus());
$('filter').addEventListener('input',()=>{let n=0;document.querySelectorAll('article').forEach(a=>{a.hidden=!a.dataset.icon.includes($('filter').value.toLowerCase().trim());if(!a.hidden)n++});status.textContent=`${n} icons`});
$('theme').addEventListener('click',()=>{const dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';$('theme').setAttribute('aria-pressed',String(dark));$('theme').textContent=dark?'Light mode':'Dark mode'});
async function copy(text){try{await navigator.clipboard.writeText(text);status.textContent='SVG copied'}catch(e){$('source').value=text;$('source').focus();$('source').select();status.textContent='SVG selected; copy manually'}}
document.querySelectorAll('[data-copy]').forEach(b=>b.addEventListener('click',()=>copy(registry[b.dataset.copy])));
function updateGear(){const n=Number($('teeth').value);if(!Number.isInteger(n)||n<5||n>12)return;const points=[];for(let i=0;i<n;i++)for(let j=0;j<4;j++){const a=-Math.PI/2+(i+(j-1.5)/4)*2*Math.PI/n,r=j===1||j===2?9.2:7.1;points.push(`${+(12+r*Math.cos(a)).toFixed(4)},${+(12+r*Math.sin(a)).toFixed(4)}`)}$('gear').querySelector('polygon').setAttribute('points',points.join(' '));$('count').value=n;$('source').value=$('gear').querySelector('svg').outerHTML}
$('teeth').addEventListener('input',updateGear);updateGear();
</script></body></html>
