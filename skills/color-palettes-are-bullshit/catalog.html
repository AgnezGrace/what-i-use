function render(){let q=$('#search').value.toLowerCase();let items=data.palettes.filter(p=>(p.title+' '+p.description+' '+p.stops.join(' ')).toLowerCase().includes(q));catalog.innerHTML=items.map(p=>{let r=p[mode];return `<article class="palette" data-id="${p.id}"><h2>${p.title}</h2><p>${p.description}</p>${swatches(p.stops)}<div class="demo" style="--bg:${r.background};--surface:${r.surface};--fg:${r.text};--muted:${r.muted};--accent:${r.accent};--on:${r.on_accent};--border:${r.border};--focus:${r.focus}"><div class="panel"><strong>Project overview</strong><p class="muted">Your workspace is ready.</p><button class="action" type="button">Continue</button> <a href="#" class="details">Details</a><p class="response" aria-live="polite" hidden></p></div></div></article>`}).join('');let r=data.rainbow,show=(r.title+' '+r.description+' '+r.tracks.map(t=>t.hue+' '+t.stops.join(' ')).join(' ')).toLowerCase().includes(q);if(show)catalog.insertAdjacentHTML('beforeend',`<article class="palette rainbow" data-id="${r.id}"><h2>${r.title}</h2><p>${r.description}</p>${r.tracks.map(t=>`<strong>${t.hue}</strong>${swatches(t.stops)}`).join('')}</article>`);$('#count').textContent=(items.length+Number(show))+' palettes';}
$('#search').addEventListener('input',render);$('#theme').addEventListener('click',()=>{mode=mode==='light'?'dark':'light';$('#theme').textContent=mode==='light'?'Dark preview':'Light preview';$('#theme').setAttribute('aria-pressed',String(mode==='dark'));render()});catalog.addEventListener('click',e=>{if(e.target.matches('.action,.details')){e.preventDefault();let p=e.target.closest('.panel').querySelector('.response');p.hidden=false;p.textContent=e.target.matches('.action')?'Ready to continue.':'Preview details are open.'}});render();</script></html>
